[package]
name = "aura"
version = "0.1.0"
description = "AURA — your personal life operating system"
authors = ["pwoyam"]
license = "MIT"
repository = "https://github.com/pwoyam/RV1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
